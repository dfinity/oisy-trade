name: Post Canbench results

on:
  workflow_run:
    workflows: ["OISY TRADE"]
    types:
      - completed

jobs:
  download-results:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-benchmarks.outputs.matrix }}
      pr_number: ${{ steps.set-benchmarks.outputs.pr_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Fork-PR artifacts are attacker-controlled: extract them into a scratch
      # directory OUTSIDE the trusted checkout and restrict the download to the
      # expected benchmark artifacts, so no artifact (e.g. one named `scripts`)
      # can overwrite the code this privileged job executes.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: canbench_result_*
          path: ${{ runner.temp }}/canbench-artifacts

      - id: set-benchmarks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_REPO: ${{ github.event.workflow_run.repository.full_name }}
          ARTIFACTS_DIR: ${{ runner.temp }}/canbench-artifacts
        run: bash "$GITHUB_WORKSPACE/scripts/ci_download_canbench_artifacts.sh"

  post-comment:
    runs-on: ubuntu-latest
    needs: [download-results]
    permissions:
      pull-requests: write
    strategy:
      matrix: ${{ fromJSON(needs.download-results.outputs.matrix) }}
    steps:
      - name: Post comment
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ${{ matrix.benchmark.result }}
          comment-tag: ${{ matrix.benchmark.title }}
          pr-number: ${{ needs.download-results.outputs.pr_number }}
